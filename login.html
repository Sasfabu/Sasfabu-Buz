<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Control de Ventas</title>
    <style>
        /* Estilos modernos y limpios para centrar el formulario en la pantalla */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 24px;
            color: #333333;
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #666666;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0070f3;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0051cb;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h2>Ingreso al Sistema</h2>

        <!-- El id="loginForm" es requerido para que login.js capture el evento -->
        <form id="loginForm">

            <div class="form-group">
                <label for="emailInput">Correo Electrónico</label>
                <!-- El id="emailInput" es el que lee tu archivo JavaScript -->
                <input type="email" id="emailInput" required placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="passwordInput">Contraseña</label>
                <!-- El id="passwordInput" es el que lee tu archivo JavaScript -->
                <input type="password" id="passwordInput" required placeholder="••••••••">
            </div>

            <button type="submit">Ingresar al Panel</button>
        </form>
    </div>

    <!-- VINCULACIÓN CRÍTICA: Llama a tu lógica de Firebase en modo módulo -->
    <script type="module" src="login.js?v=3"></script>

</body>

</html>
