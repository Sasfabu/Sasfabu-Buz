<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso Vendedores - Sasfabu</title>
    <!-- Usamos el mismo Bootstrap que ya tienes en tu proyecto -->
    <link rel="stylesheet" href="bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-container {
            max-width: 400px;
            margin-top: 100px;
        }
    </style>
</head>

<body>

    <div class="container login-container bg-white p-4 shadow rounded">
        <h3 class="text-center text-primary mb-4">Acceso Vendedores</h3>

        <form id="login-form">
            <div class="mb-3">
                <label for="input-correo" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="input-correo" placeholder="usuario@sasfabu.com" required>
            </div>
            <div class="mb-3">
                <label for="input-password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="input-password" placeholder="••••••••" required>
            </div>
            <button type="button" id="btn-login" class="btn btn-primary w-100 py-2">Ingresar al Panel</button>
        </form>

        <div class="text-center mt-3">
            <a href="index.html" class="text-muted small">Volver al inicio</a>
        </div>
    </div>

    <!-- Tu script de lógica que conectaremos luego -->
    <script type="module" src="login.js"></script>
</body>

</html>
